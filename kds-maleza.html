<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Maleza Café | Tablero KDS Barra</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maleza: {
              dark: '#203322',
              DEFAULT: '#2F4832',
              light: '#5B755E',
              cream: '#F4F2EB',
              accent: '#B86543',
              badge: '#E2E8DD',
              badgeText: '#3B523E'
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    body { 
      background-color: #ECE9DF; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }
  </style>
</head>
<body class="text-zinc-800 antialiased min-h-screen flex flex-col items-center">

  <section id="kds-auth-screen" class="min-h-screen w-full flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-xl border border-zinc-200">
      <span class="w-12 h-12 bg-maleza/10 text-maleza flex items-center justify-center rounded-full mx-auto text-xl mb-3">🔒</span>
      <h3 class="font-serif font-bold text-xl text-maleza-dark">Acceso a Barra / Cocina</h3>
      <p class="text-xs text-zinc-500 mb-5">Ingresa el PIN de seguridad del KDS</p>
      <input type="password" id="kds-pin-input" maxlength="4" placeholder="••••" class="text-center tracking-widest text-2xl font-mono font-bold w-36 mx-auto bg-zinc-100 border border-zinc-300 rounded-xl py-2 mb-4 focus:outline-none focus:border-maleza">
      <button type="button" onclick="window.unlockKDS()" class="w-full bg-maleza hover:bg-maleza-dark text-white font-semibold text-sm py-3 rounded-xl shadow-md transition-all cursor-pointer">
        Ingresar al Tablero
      </button>
    </div>
  </section>

  <main id="view-tablet" class="hidden p-4 w-full max-w-7xl">
    <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm border border-zinc-200 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-5 h-5 rounded-full bg-maleza-dark flex items-center justify-center text-white text-[9px]">🌿</span>
          <h2 class="font-serif text-xl font-bold text-maleza-dark">Pantalla de Comandas (KDS)</h2>
          <span id="cloud-badge" class="text-[10px] bg-zinc-200 text-zinc-700 px-2 py-0.5 rounded-full font-medium">Iniciando...</span>
        </div>
        <div class="flex items-center gap-2 mt-0.5">
          <span id="kds-active-date-label" class="text-xs font-semibold text-maleza-dark">Viendo: Hoy</span>
          <span class="text-zinc-300">|</span>
          <button type="button" onclick="window.openHistoryModal()" class="text-xs text-maleza-accent hover:underline font-semibold cursor-pointer">
            Historial de Fechas
          </button>
        </div>
      </div>

      <div class="flex items-center flex-wrap gap-2">
        <button type="button" onclick="window.exportCurrentOrdersCSV()" class="bg-[#2f4832] hover:bg-maleza-dark text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-sm cursor-pointer">
          Exportar CSV
        </button>
        <button type="button" onclick="window.openResetCutModal()" class="bg-rose-700 hover:bg-rose-800 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-sm cursor-pointer flex items-center gap-1">
          🔒 Reiniciar Corte a $0
        </button>
        <button type="button" onclick="window.handleShiftClosing()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-sm cursor-pointer">
          Cerrar Turno
        </button>
        <div class="bg-[#FAF9F5] border border-maleza/20 px-3 py-1.5 rounded-xl text-right">
          <span class="block text-[9px] text-zinc-500 font-bold uppercase">Corte Activo</span>
          <span id="kds-sales-total" class="font-serif font-bold text-base text-maleza-dark">$0.00</span>
        </div>
        <button type="button" onclick="window.lockKDS()" title="Bloquear pantalla" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-600 text-xs p-2 rounded-xl cursor-pointer">
          Salir
        </button>
      </div>
    </div>

    <div id="kds-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </main>

  <div id="reset-cut-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center border border-zinc-200">
      <div class="w-12 h-12 bg-rose-50 text-rose-700 flex items-center justify-center rounded-full mx-auto text-xl mb-3 font-bold">0️⃣</div>
      <h3 class="font-serif font-bold text-xl text-maleza-dark mb-1">Reiniciar Corte a $0.00</h3>
      <p class="text-xs text-zinc-500 mb-4 leading-relaxed">
        Se descargará un respaldo en Excel y el corte volverá a ceros.
      </p>
      <div class="mb-4">
        <label class="block text-xs font-bold text-zinc-700 mb-1">Ingresa PIN de Dueño:</label>
        <input type="password" id="owner-pin-input" maxlength="4" placeholder="••••" class="text-center tracking-widest text-2xl font-mono font-bold w-36 mx-auto bg-zinc-100 border border-zinc-300 rounded-xl py-2 focus:outline-none focus:border-rose-600">
        <p id="owner-pin-error" class="hidden text-[11px] text-rose-600 font-semibold mt-1.5">PIN incorrecto.</p>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="window.confirmResetCut()" class="w-full bg-rose-700 hover:bg-rose-800 text-white font-semibold text-xs py-2.5 rounded-xl transition-all cursor-pointer shadow-sm">Confirmar</button>
        <button type="button" onclick="window.closeResetCutModal()" class="w-full bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-semibold text-xs py-2.5 rounded-xl transition-all cursor-pointer">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="history-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl">
      <div class="flex justify-between items-center border-b border-zinc-100 pb-2 mb-3">
        <h3 class="font-serif font-bold text-lg text-maleza-dark">Historial de Comandas</h3>
        <button type="button" onclick="window.closeHistoryModal()" class="text-zinc-400 hover:text-zinc-700 text-xl cursor-pointer">&times;</button>
      </div>
      <div class="space-y-3 mb-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-600 mb-1">Fecha:</label>
          <input type="date" id="history-date-picker" class="w-full bg-zinc-50 text-zinc-800 text-sm px-3 py-2 rounded-xl border border-zinc-200 focus:outline-none focus:border-maleza">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="window.loadHistoryDate()" class="w-full bg-maleza text-white font-semibold text-xs py-2.5 rounded-xl cursor-pointer">Consultar</button>
          <button type="button" onclick="window.resetToToday()" class="w-full bg-zinc-100 text-zinc-700 font-semibold text-xs py-2.5 rounded-xl cursor-pointer">Hoy</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Firmas criptográficas SHA-256 (AppSec Defensivo)
      // "1234" = 03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4
      // "0000" = 9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0
      const KDS_PIN_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
      const OWNER_PIN_HASH = "9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0";

      async function sha256(str) {
        const buffer = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buffer);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      const firebaseConfig = {
        apiKey: "AIzaSyC-R4TAHZqtW4jU-mKrvEWOhJiQq1Z5raQ",
        authDomain: "maleza-cafe.firebaseapp.com",
        projectId: "maleza-cafe",
        storageBucket: "maleza-cafe.firebasestorage.app",
        messagingSenderId: "523980403582",
        appId: "1:523980403582:web:40bc172da3a86da9bcb92f"
      };

      const SafeStorage = {
        memory: {},
        getItem: function(key) {
          try { return window.localStorage.getItem(key); } catch (e) { return this.memory[key] || null; }
        },
        setItem: function(key, val) {
          try { window.localStorage.setItem(key, val); } catch (e) { this.memory[key] = String(val); }
        },
        getSession: function(key) {
          try { return window.sessionStorage.getItem(key); } catch (e) { return this.memory['s_' + key] || null; }
        },
        setSession: function(key, val) {
          try { window.sessionStorage.setItem(key, val); } catch (e) { this.memory['s_' + key] = String(val); }
        },
        removeSession: function(key) {
          try { window.sessionStorage.removeItem(key); } catch (e) { delete this.memory['s_' + key]; }
        }
      };

      let db = null;
      let isCloud = false;

      try {
        if (typeof firebase !== 'undefined' && firebaseConfig.apiKey) {
          if (!firebase.apps || firebase.apps.length === 0) {
            firebase.initializeApp(firebaseConfig);
          }
          db = firebase.firestore();
          isCloud = true;
        }
      } catch (e) {
        console.warn("Modo Local Activo");
      }

      let orders = [];
      let kdsUnsubscribe = null;

      function getLocalDateString(d) {
        const dateObj = d || new Date();
        const tzOffset = dateObj.getTimezoneOffset() * 60000;
        return new Date(dateObj.getTime() - tzOffset).toISOString().slice(0, 10);
      }
      
      let selectedKdsDateStr = getLocalDateString();

      window.unlockKDS = async function() {
        const pin = document.getElementById('kds-pin-input').value;
        const hashInput = await sha256(pin);
        if (hashInput === KDS_PIN_HASH) {
          SafeStorage.setSession('maleza_kds_unlocked', 'true');
          document.getElementById('kds-auth-screen').classList.add('hidden');
          showKDSScreen();
        } else {
          alert("PIN incorrecto. Acceso denegado.");
          document.getElementById('kds-pin-input').value = "";
        }
      };
      
      window.lockKDS = function() {
        SafeStorage.removeSession('maleza_kds_unlocked');
        location.reload();
      };

      function showKDSScreen() {
        document.getElementById('view-tablet').classList.remove('hidden');
        document.getElementById('history-date-picker').value = selectedKdsDateStr;
        const b = document.getElementById('cloud-badge');
        if (b) {
          b.textContent = isCloud ? 'Nube Activa (Firebase)' : 'Modo Local';
          b.className = isCloud
            ? 'text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium'
            : 'text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium';
        }
        startKDSListener(selectedKdsDateStr);
      }

      function startKDSListener(targetDateStr) {
        if (kdsUnsubscribe) kdsUnsubscribe();

        const isToday = targetDateStr === getLocalDateString();
        document.getElementById('kds-active-date-label').textContent = isToday 
          ? "Viendo: Hoy (" + targetDateStr + ")" 
          : "Viendo Historial: " + targetDateStr;

        let isFirstLoad = true;

        if (isCloud && db) {
          const q = db.collection("orders").where("dateStr", "==", targetDateStr);
          kdsUnsubscribe = q.onSnapshot(function(snapshot) {
            orders = [];
            let hasNewOrders = false;
            snapshot.docChanges().forEach(function(change) { if (change.type === "added") hasNewOrders = true; });
            snapshot.forEach(function(doc) { orders.push(Object.assign({ id: doc.id }, doc.data())); });
            orders.sort(function(a, b) { return (b.timestampStr || '').localeCompare(a.timestampStr || ''); });
            renderKDS();

            if (!isFirstLoad && hasNewOrders && isToday) playChime();
            isFirstLoad = false;
          });
        } else {
          const allOrders = JSON.parse(SafeStorage.getItem('maleza_orders') || '[]');
          orders = allOrders.filter(function(o) { return o.dateStr === targetDateStr; });
          renderKDS();
        }
      }

      window.openHistoryModal = function() { document.getElementById('history-modal').classList.remove('hidden'); };
      window.closeHistoryModal = function() { document.getElementById('history-modal').classList.add('hidden'); };

      window.loadHistoryDate = function() {
        const selected = document.getElementById('history-date-picker').value;
        if (!selected) return alert("Selecciona una fecha válida.");
        selectedKdsDateStr = selected;
        startKDSListener(selectedKdsDateStr);
        window.closeHistoryModal();
      };
      
      window.resetToToday = function() {
        selectedKdsDateStr = getLocalDateString();
        document.getElementById('history-date-picker').value = selectedKdsDateStr;
        startKDSListener(selectedKdsDateStr);
        window.closeHistoryModal();
      };

      window.openResetCutModal = function() {
        const pinInput = document.getElementById('owner-pin-input');
        const err = document.getElementById('owner-pin-error');
        if (pinInput) pinInput.value = "";
        if (err) err.classList.add('hidden');
        document.getElementById('reset-cut-modal').classList.remove('hidden');
        if (pinInput) pinInput.focus();
      };

      window.closeResetCutModal = function() {
        document.getElementById('reset-cut-modal').classList.add('hidden');
      };

      window.confirmResetCut = async function() {
        const pinVal = document.getElementById('owner-pin-input').value;
        const err = document.getElementById('owner-pin-error');
        const hashInput = await sha256(pinVal);

        if (hashInput !== OWNER_PIN_HASH) {
          if (err) err.classList.remove('hidden');
          document.getElementById('owner-pin-input').value = "";
          return;
        }

        const activeOrders = orders.filter(function(o) { 
          return o.status !== 'canceled' && o.status !== 'returned' && o.status !== 'archived_cut'; 
        });

        if (activeOrders.length > 0) {
          const timeNow = new Date().toTimeString().slice(0,5).replace(':', '-');
          window.exportCurrentOrdersCSV(`Respaldo_Corte_${selectedKdsDateStr}_${timeNow}.csv`);
        }

        if (isCloud && db) {
          try {
            const batch = db.batch();
            activeOrders.forEach(function(o) {
              if (o.id) {
                batch.update(db.collection("orders").doc(o.id), { status: 'archived_cut' });
              }
            });
            await batch.commit();
          } catch(e) {
            console.error("Error al reiniciar corte en nube:", e);
          }
        } else {
          const all = JSON.parse(SafeStorage.getItem('maleza_orders') || '[]');
          all.forEach(function(o) {
            if (o.dateStr === selectedKdsDateStr && o.status !== 'canceled' && o.status !== 'returned' && o.status !== 'archived_cut') {
              o.status = 'archived_cut';
            }
          });
          SafeStorage.setItem('maleza_orders', JSON.stringify(all));
          startKDSListener(selectedKdsDateStr);
        }

        window.closeResetCutModal();
        alert("Corte reiniciado a $0.00 exitosamente.");
      };

      window.handleShiftClosing = function() {
        const validOrders = orders.filter(function(o) { return o.status !== 'canceled' && o.status !== 'returned' && o.status !== 'archived_cut'; });
        if (validOrders.length === 0) return alert("No hay comandas activas para realizar corte.");

        const totalShift = validOrders.reduce(function(s, o) { return s + (o.total || 0); }, 0);
        const confirmClose = confirm("¿Limpiar tablero y hacer corte?\n\nTotal: $" + totalShift.toFixed(2) + "\nComandas: " + validOrders.length);
        if (!confirmClose) return;

        window.exportCurrentOrdersCSV("Corte_Caja_Maleza_" + selectedKdsDateStr + ".csv");

        if (isCloud && db) {
          const batch = db.batch();
          orders.forEach(function(o) {
            if (o.id && o.status !== 'archived' && o.status !== 'canceled' && o.status !== 'returned' && o.status !== 'archived_cut') {
              batch.update(db.collection("orders").doc(o.id), { status: 'archived' });
            }
          });
          batch.commit().then(function() { alert("Tablero limpio."); }).catch(console.error);
        } else {
          const all = JSON.parse(SafeStorage.getItem('maleza_orders') || '[]');
          all.forEach(function(o) {
            if (o.dateStr === selectedKdsDateStr && o.status !== 'canceled' && o.status !== 'returned') o.status = 'archived';
          });
          SafeStorage.setItem('maleza_orders', JSON.stringify(all));
          startKDSListener(selectedKdsDateStr);
          alert("Tablero limpio.");
        }
      };

      window.updateOrderStatus = async function(id, status) {
        if (isCloud && db) {
          try { await db.collection("orders").doc(id).update({ status: status }); } catch (e) { console.error(e); }
        } else {
          const all = JSON.parse(SafeStorage.getItem('maleza_orders') || '[]');
          const o = all.find(function(x) { return x.id === id; });
          if (o) { o.status = status; SafeStorage.setItem('maleza_orders', JSON.stringify(all)); startKDSListener(selectedKdsDateStr); }
        }
      };

      window.exportCurrentOrdersCSV = function(customFileName) {
        if (orders.length === 0) return alert("No hay pedidos para exportar en esta fecha.");
        let csv = "\uFEFFID,Fecha,Hora,Tipo,Cliente,Productos,Pago,Total,Estatus\n";
        orders.forEach(function(o) {
          const items = '"' + o.items.map(function(i) { return i.qty + 'x ' + i.name + ' (' + (i.details || '') + ')'; }).join(' | ').replace(/"/g, '""') + '"';
          const tType = o.orderType || 'Para comer aquí';
          csv += (o.id || '') + ',' + (o.dateStr || selectedKdsDateStr) + ',' + (o.timestampStr || '') + ',"' + tType + '","' + o.clientName + '",' + items + ',' + (o.paymentMethod || 'Efectivo') + ',' + o.total.toFixed(2) + ',' + o.status + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = customFileName || ('Ventas_Maleza_' + selectedKdsDateStr + '.csv');
        link.click();
      };

      function renderKDS() {
        const grid = document.getElementById('kds-grid');
        const totalEl = document.getElementById('kds-sales-total');
        
        const isToday = selectedKdsDateStr === getLocalDateString();
        
        const visibleOrders = isToday 
          ? orders.filter(function(o) { return o.status !== 'archived' && o.status !== 'canceled' && o.status !== 'returned' && o.status !== 'archived_cut'; }) 
          : orders;

        const activeCutOrders = orders.filter(function(o) { return o.status !== 'canceled' && o.status !== 'returned' && o.status !== 'archived_cut' && o.status !== 'archived'; });
        const totalSum = activeCutOrders.reduce(function(s, o) { return s + (o.total || 0); }, 0);
        if (totalEl) totalEl.textContent = '$' + totalSum.toFixed(2);

        if (visibleOrders.length === 0) {
          grid.innerHTML = '<div class="col-span-full py-16 text-center text-zinc-400 font-medium">Pantalla limpia. Esperando comandas...</div>';
          return;
        }

        grid.innerHTML = visibleOrders.map(function(o) {
          const isPend = o.status === 'pending';
          const isPrep = o.status === 'preparing';
          const isArch = o.status === 'archived' || o.status === 'archived_cut';
          const isCanc = o.status === 'canceled' || o.status === 'returned';
          const isToGo = o.orderType === 'Para llevar';
          const isCard = o.paymentMethod === 'Tarjeta';
          
          const border = isPend ? 'border-amber-400' : isPrep ? 'border-blue-500' : isCanc ? 'border-red-300 opacity-50 bg-red-50' : isArch ? 'border-zinc-300 opacity-50 bg-zinc-50' : 'border-emerald-500 opacity-70 bg-emerald-50';
          const badgeTxt = isPend ? 'PENDIENTE' : isPrep ? 'PREPARANDO' : isCanc ? 'CANCELADO' : isArch ? 'CORTE CERRADO' : 'LISTO';
          
          const typeBadge = isToGo 
            ? '<span class="text-[9px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 ml-2 uppercase">🛍️ Para Llevar</span>'
            : '<span class="text-[9px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 ml-2 uppercase">🍽️ Mesa/Barra</span>';

          const itemsHtml = o.items.map(function(i) {
            return '<div class="text-xs bg-zinc-50 p-1.5 rounded-lg border border-zinc-100">' +
              '<strong>' + i.qty + 'x ' + i.name + '</strong> - $' + i.total +
              (i.details ? '<p class="text-[11px] text-zinc-500 font-medium">• ' + i.details + '</p>' : '') +
            '</div>';
          }).join('');

          let buttonsHtml = '';
          if (isPend) {
            buttonsHtml = '<div class="grid grid-cols-2 gap-2">' +
              '<button type="button" onclick="window.updateOrderStatus(\'' + o.id + '\', \'preparing\')" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs py-2 rounded-xl font-semibold cursor-pointer">Iniciar Prep.</button>' +
              '<button type="button" onclick="window.updateOrderStatus(\'' + o.id + '\', \'returned\')" class="w-full bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs py-2 rounded-xl font-semibold cursor-pointer">Devolver a Cliente</button>' +
            '</div>';
          } else if (isPrep) {
            buttonsHtml = '<button type="button" onclick="window.updateOrderStatus(\'' + o.id + '\', \'ready\')" class="w-full bg-emerald-600 text-white text-xs py-2 rounded-xl font-semibold cursor-pointer">Marcar Listo</button>';
          } else if (isArch || isCanc) {
            buttonsHtml = '<span class="block w-full text-center text-zinc-400 text-[11px] py-1.5 font-semibold">Historial (No interactivo)</span>';
          } else {
            buttonsHtml = '<button type="button" onclick="window.updateOrderStatus(\'' + o.id + '\', \'archived\')" class="w-full text-zinc-500 border border-zinc-300 text-xs py-1.5 rounded-lg hover:bg-zinc-50 font-semibold mb-1 cursor-pointer">Archivar y Ocultar</button>' +
              '<button type="button" onclick="window.updateOrderStatus(\'' + o.id + '\', \'preparing\')" class="w-full text-zinc-400 text-[10px] py-1 cursor-pointer">Reabrir</button>';
          }

          const cardAlert = (isCard && !isArch && !isCanc)
            ? '<div class="bg-amber-100 border border-amber-300 text-amber-900 rounded-lg p-1.5 mb-2 flex items-center justify-center gap-1.5 font-bold text-[11px] animate-pulse">' +
                '<span>💳 LLEVAR TERMINAL</span>' +
              '</div>' 
            : '';

          return '<div class="bg-white rounded-2xl border-2 ' + border + ' p-3.5 shadow-sm flex flex-col justify-between">' +
            '<div>' +
              '<div class="flex justify-between border-b pb-2 mb-2">' +
                '<div>' +
                  '<div class="flex items-center">' +
                    '<span class="text-[10px] text-zinc-400 font-mono">' + (o.id ? o.id.slice(-5) : '') + '</span>' +
                    typeBadge +
                  '</div>' +
                  '<h4 class="font-bold text-sm leading-tight mt-1">' + o.clientName + '</h4>' +
                '</div>' +
                '<div class="text-right">' +
                  '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-zinc-100">' + badgeTxt + '</span>' +
                  '<span class="block text-[11px] text-zinc-400 mt-1">' + (o.timestampStr || '') + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="space-y-1 mb-2.5">' + itemsHtml + '</div>' +
            '</div>' +
            '<div class="border-t pt-2">' +
              cardAlert +
              '<div class="flex justify-between text-xs mb-2">' +
                '<span>Pago: <strong>' + (o.paymentMethod || 'Efectivo') + '</strong></span>' +
                '<span class="font-bold text-maleza-dark ' + (isCanc ? 'line-through text-red-400' : '') + '">$' + o.total.toFixed(2) + '</span>' +
              '</div>' +
              buttonsHtml +
            '</div>' +
          '</div>';
        }).join('');
      }

      function playChime() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(587, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.8);
        } catch (e) {}
      }

      function initKDS() {
        if (SafeStorage.getSession('maleza_kds_unlocked') === 'true') {
          document.getElementById('kds-auth-screen').classList.add('hidden');
          showKDSScreen();
        } else {
          document.getElementById('kds-auth-screen').classList.remove('hidden');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initKDS);
      } else {
        initKDS();
      }
    })();
  </script>
</body>
</html>
